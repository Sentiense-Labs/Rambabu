[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-rc-car"
version = "0.1.0"
description = "Autonomous RC Car powered by Claude AI"
authors = [
    {name = "Sentiense", email = "info@sentiense.io"},
]
dependencies = [
    "RPi.GPIO>=0.7.1",
    "picamera2>=0.3.17",
    "opencv-python>=4.9.0",
    "numpy>=1.26.0",
    "httpx>=0.28.0",
    "orjson>=3.9.0",
    "SpeechRecognition>=3.10.0",
    "pyaudio>=0.2.14",
    "pyttsx3>=2.90",
    "faster-whisper>=0.10.0",
    "openwakeword>=0.6.0",
    "paho-mqtt>=2.0.0",
    "awsiotsdk>=1.20.0",
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "typing-extensions>=4.15.0",
]
requires-python = ">=3.10"

[tool.uv]
# tflite-runtime has no wheels for Python 3.13 — we use ONNX inference instead
override-dependencies = ["tflite-runtime ; python_version < '0'"]
dev-dependencies = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["lib", "vision", "navigation", "server", "utils", "config"]

[project.scripts]
ai-rc-car = "main:main"
